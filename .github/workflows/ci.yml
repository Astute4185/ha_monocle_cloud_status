name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Ruff
        run: python -m pip install "ruff>=0.16.4,<0.17"

      - name: Validate repository metadata
        run: python scripts/validate_repo.py

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q custom_components scripts tests

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-test.txt

      - name: Install test dependencies (matching HA and pytest fixtures)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt -r requirements-runtime.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Show Home Assistant test versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          ha, fixtures = version('homeassistant'), version('pytest-homeassistant')
          print(f'Home Assistant: {ha}; pytest-homeassistant: {fixtures}')
          if ha != fixtures:
              raise SystemExit('Home Assistant and pytest-homeassistant must match')
          PY

      - name: Run full pytest suite with coverage
        run: python -m pytest

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install runtime dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.txt "pip-audit>=2.10.1"

      - name: Verify installed runtime dependencies
        run: python -m pip check

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements-runtime.txt
