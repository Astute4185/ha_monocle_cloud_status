rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register custom service actions.
  appropriate-polling:
    status: exempt
    comment: Telemetry is delivered by Socket.IO push events.
  brands:
    status: todo
    comment: A Home Assistant brands repository contribution is required before a Core PR.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: The Monocle protocol/API implementation still needs extraction to a separately packaged Python library for a Core contribution.
  docs-actions:
    status: exempt
    comment: This integration does not register custom service actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide conditions.
  docs-high-level-description:
    status: todo
    comment: README coverage exists, but official Home Assistant integration documentation must accompany a Core contribution.
  docs-installation-instructions:
    status: todo
    comment: README coverage exists, but official Home Assistant integration documentation must accompany a Core contribution.
  docs-removal-instructions:
    status: todo
    comment: Add removal instructions to the official Home Assistant documentation contribution.
  docs-triggers:
    status: exempt
    comment: This integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: Entities do not register their own event listeners.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: todo
    comment: Requires official Home Assistant documentation.
  docs-installation-parameters:
    status: todo
    comment: Requires official Home Assistant documentation.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: CI currently enforces an 80 percent floor; increase to the quality-scale target after expanding tests.

  # Gold
  devices: done
  diagnostics: todo
  discovery:
    status: exempt
    comment: The cloud service provides no known local discovery mechanism.
  discovery-update-info:
    status: exempt
    comment: Discovery is not supported by the cloud service.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: A config entry represents a single Monocle location and does not dynamically add devices.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The small fixed entity set is intentionally enabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: The integration does not dynamically create or remove devices.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
